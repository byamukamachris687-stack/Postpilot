{% extends "base.html" %}
{% block title %}Comment Reply Generator — PostPilot{% endblock %}
{% block content %}
<h2 class="mb-3">Comment Reply Generator</h2>
<form method="POST" class="card shadow-sm p-4 mb-4">
  <div class="mb-3">
    <label class="form-label">Brand</label>
    <select name="brand_id" class="form-select">
      {% for b in brands %}<option value="{{ b.id }}" {% if brand and b.id==brand.id %}selected{% endif %}>{{ b.name }}</option>{% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Customer comment</label>
    <textarea name="comment" class="form-control" rows="3" required placeholder="Paste the comment here...">{{ comment }}</textarea>
  </div>
  <button class="btn btn-primary">Generate replies</button>
</form>

{% if replies %}
<h4>Reply options</h4>
<div class="row g-3">
  {% for r in replies %}
  <div class="col-md-4">
    <div class="card shadow-sm h-100">
      <div class="card-header"><span class="badge bg-secondary">{{ r.tone }}</span></div>
      <div class="card-body">
        <p style="white-space:pre-wrap;">{{ r.text }}</p>
        <button class="btn btn-sm btn-outline-secondary" onclick="navigator.clipboard.writeText('{{ r.text|e }}')">Copy</button>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endif %}
{% endblock %}
